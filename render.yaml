# Blueprint do Render — serviço web (Docker) usando um Postgres EXTERNO (Neon).
# No Render: New → Blueprint → conecte este repositório. Depois, no dashboard,
# preencha as variáveis marcadas como "sync: false" (segredos), incluindo o
# DATABASE_URL com a connection string do Neon (conexão DIRETA, não a pooled).
services:
  - type: web
    name: whatsapp-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    # US$ 7/mês (~R$ 36) — a menor instância que NÃO hiberna.
    # O `free` hiberna após ~15 min sem tráfego e leva ~50 s para acordar: a Meta
    # recebe timeout no webhook, os lembretes (setInterval) não rodam e o lote de
    # mensagens em memória se perde. Ver a seção 0 do DEPLOY.md.
    # Atenção: os US$ 25 que aparecem no site são o WORKSPACE Pro, que é opcional —
    # o workspace Hobby é grátis e já aceita instâncias pagas como esta.
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: ADMIN_USER
        value: admin
      # Gerado automaticamente pelo Render:
      - key: SESSION_SECRET
        generateValue: true
      # Preencha no dashboard (não versionados):
      - key: DATABASE_URL
        sync: false # cole a connection string DIRETA do Neon (com ?sslmode=require)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
