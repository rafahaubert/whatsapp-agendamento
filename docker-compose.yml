# Sobe PostgreSQL + o agente para desenvolvimento local.
# (O schema já usa `provider = "postgresql"`; a instrução de trocar o provider
# que ficava aqui era resíduo da época do SQLite.)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: whatsapp
      POSTGRES_DB: whatsapp_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://whatsapp:whatsapp@db:5432/whatsapp_agent?schema=public
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
    ports:
      - "3000:3000"

volumes:
  pgdata:
